# Policy for vuln-bump. NOT an inventory: the pins themselves are discovered by
# scanning the org's Dockerfiles (see discover.js).
#
# A hand-written inventory was the first design and it was stale within a day -
# it declared 12 pins while the org had 20, and three of the eight it missed
# were still on the vulnerable tofu 1.10.10. Only what a tool cannot infer stays
# declared here.

# ARG name -> upstream project. An ARG that is not listed is reported as
# UNMAPPED rather than guessed: the bot must never edit a pin nobody mapped.
tools:
  TOFU: tofu
  KUBECTL: kubectl
  HELM: helm

# Highest version allowed per tool. This is org policy, not a per-repo
# preference, which is why it lives here.
ceilings:
  # kubectl supports +-1 minor against the cluster. Raising this decides which
  # Kubernetes version we stop supporting - it is not a dependency bump.
  # Measured: no version <=1.31 improves; 1.37.0 clears all 32, seven minors away.
  kubectl: "1.31.99"

  # Helm 4 carries breaking changes. 3.22.0 already scans clean.
  helm: "3.99.99"

  # OpenTofu: no ceiling. Minors within 1.x are backward compatible.
  tofu: null
