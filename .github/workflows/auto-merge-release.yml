name: auto-merge-release-pr

on:
  workflow_call:
    inputs:
      release_pr_label:
        description: 'Label release-please sets on its release PR while pending'
        required: false
        type: string
        default: 'autorelease: pending'
      release_pr_author:
        description: 'Expected author login of the release PR'
        required: false
        type: string
        default: 'github-actions[bot]'
      merge_method:
        description: 'Merge method to use when merging the release PR (merge, squash, rebase)'
        required: false
        type: string
        default: 'merge'
      pr_number:
        description: >-
          Explicit PR number to merge. Set this when calling from a workflow_run
          (or other non-pull_request) trigger, where github.event.pull_request
          isn't available — the caller is then responsible for resolving the PR
          and checking its author/label itself. Leave at 0 for pull_request-
          triggered callers, which fall back to github.event.pull_request.
        required: false
        type: number
        default: 0
    secrets:
      app-id:
        description: 'GitHub App ID used to mint a token that can trigger downstream workflows'
        required: true
      app-private-key:
        description: 'GitHub App private key'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge release PR
    if: |
      inputs.pr_number != 0 ||
      (github.event.pull_request.user.login == inputs.release_pr_author &&
       contains(github.event.pull_request.labels.*.name, inputs.release_pr_label))
    runs-on: ubuntu-24.04
    steps:
      # A merge done with the default GITHUB_TOKEN would not trigger the
      # push-triggered release workflow on main (GitHub's Actions loop
      # prevention), so the tag/GitHub Release would never get created.
      # Minting a token from a GitHub App avoids that restriction.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Wait for other checks to pass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number != 0 && inputs.pr_number || github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # gh pr checks --watch would include this very job's own check run,
          # which never turns green until this step finishes — a deadlock.
          # So we poll and explicitly exclude any check whose link points at
          # this run (identified via the /runs/<RUN_ID>/ segment in its URL).
          #
          # gh pr checks --json exits non-zero instead of returning an empty
          # list when a PR has zero checks registered — but ALSO for a
          # variety of unrelated failures (expired/bad token, rate limits,
          # transient 5xx, PR/commit not found). --json suppresses gh's own
          # pending/failing exit codes, so a non-zero exit here never means
          # "checks are red" — but it CAN mean "we can't tell", and treating
          # that the same as "this PR genuinely has no checks" would merge
          # an unverified PR. So only the specific "no checks reported"
          # message — and only before any real check has ever been seen on
          # this run — counts toward the short grace period below. Any
          # other failure (including "no checks reported" showing up AGAIN
          # after checks were already seen once, e.g. because release-please
          # force-pushed a new commit onto its own PR and the new head's
          # checks haven't registered yet) is just retried like a pending
          # check, relying on the outer 90-try timeout to fail closed if it
          # never recovers — deliberately not a separate hard error, so a
          # lone transient blip or a routine head change doesn't kill the
          # whole run.
          no_checks_grace=0
          checks_seen=false
          done_waiting=false
          err_file="${RUNNER_TEMP:-/tmp}/gh_pr_checks_err"
          for i in $(seq 1 90); do
            if ! checks="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json name,state,link 2>"$err_file")"; then
              err="$(cat "$err_file" 2>/dev/null || true)"
              if printf '%s' "$err" | grep -qi 'no checks reported'; then
                if [ "$checks_seen" = false ]; then
                  no_checks_grace=$((no_checks_grace + 1))
                  if [ "$no_checks_grace" -ge 10 ]; then
                    echo "::warning::No checks registered on PR #$PR_NUMBER after $no_checks_grace attempts — merging without check verification."
                    done_waiting=true
                    break
                  fi
                  echo "No checks registered yet on PR #$PR_NUMBER (grace attempt $no_checks_grace/10, overall $i/90), waiting..."
                else
                  echo "PR #$PR_NUMBER currently reports no checks (overall $i/90) — its head may have just changed, waiting for its checks..."
                fi
              else
                echo "::warning::gh pr checks failed on PR #$PR_NUMBER (overall $i/90), retrying: $err"
              fi
              sleep 15
              continue
            fi
            checks_seen=true
            no_checks_grace=0

            others="$(echo "$checks" | jq --arg run "/runs/$RUN_ID/" '[.[] | select(.link | contains($run) | not)]')"

            failing="$(echo "$others" | jq 'map(select(.state=="FAILURE" or .state=="ERROR" or .state=="CANCELLED" or .state=="TIMED_OUT")) | length')"
            if [ "$failing" -gt 0 ]; then
              echo "::error::One or more checks failed on PR #$PR_NUMBER"
              echo "$others"
              exit 1
            fi

            pending="$(echo "$others" | jq 'map(select(.state=="PENDING" or .state=="QUEUED" or .state=="IN_PROGRESS")) | length')"
            if [ "$pending" -eq 0 ]; then
              echo "All other checks passed."
              done_waiting=true
              break
            fi

            echo "Waiting on $pending check(s)..."
            sleep 15
          done

          if [ "$done_waiting" != true ]; then
            echo "::error::Timed out waiting for checks on PR #$PR_NUMBER"
            exit 1
          fi

      - name: Merge release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number != 0 && inputs.pr_number || github.event.pull_request.number }}
          MERGE_METHOD: ${{ inputs.merge_method }}
        # --admin: the App token still hits "base branch policy prohibits the
        # merge" (required review/status-check rules) without it, even though
        # checks were confirmed green above — the App isn't actually treated
        # as a bypass actor on the caller repo's ruleset. --admin only works
        # if the App's installation grants it Administration permission on
        # the repo; if it doesn't, this will fail with a clearer permission
        # error instead of the generic "policy prohibits" one.
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --"$MERGE_METHOD" --admin
