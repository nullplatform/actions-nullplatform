name: pr-checks-renovate-config

# renovate-config.js is only exercised by the scheduled run, up to two weeks away: an upgrade of
# Renovate that drops an option we use would land green and only fail there. This validates the
# config with the Renovate version that will actually run, which is the default of the action
# revision pinned in renovate.yml.

on:
  pull_request:
    paths:
      - renovate-config.js
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate against the Renovate version the action runs
        run: |
          set -euo pipefail
          ref=$(sed -nE 's#.*uses: renovatebot/github-action@([0-9a-f]{40}).*#\1#p' .github/workflows/renovate.yml | head -1)
          if [ -z "${ref}" ]; then
            echo "::error file=.github/workflows/renovate.yml::renovatebot/github-action is not pinned to a commit SHA"
            exit 1
          fi
          version=$(curl -fsSL "https://raw.githubusercontent.com/renovatebot/github-action/${ref}/action.yml" \
            | awk '/^  renovate-version:/{f=1} f && /default:/{gsub(/[^0-9.]/, "", $2); print $2; exit}')
          if [ -z "${version}" ]; then
            echo "::error::could not read the renovate-version default from the action at ${ref}"
            exit 1
          fi
          echo "validating renovate-config.js with renovate@${version} (default of action ${ref})"
          # Not --strict: the action's default is a floating major, so a Renovate minor can start
          # asking for a config migration at any time. Renovate applies migrations by itself at
          # run time, so a pending one is reported as a warning instead of failing whichever
          # unrelated PR happens to touch these paths next. Real config errors still fail.
          npx -y -p "renovate@${version}" renovate-config-validator renovate-config.js 2>&1 | tee validator.log
          if grep -q 'Config migration necessary' validator.log; then
            echo "::warning file=renovate-config.js::Renovate ${version} asks for a config migration (diff in this step's log). The scheduled run still works; apply the migration when convenient."
          fi
