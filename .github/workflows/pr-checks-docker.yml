name: PR Checks - Docker Build

on:
  workflow_call:
    inputs:
      context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      use-app-token:
        description: >-
          Mint a GitHub App installation token and use it for the build,
          ahead of CI_TOKEN/DEPENDABOT_TOKEN. Opt in per repository: CI_APP_ID
          is an ORG secret, so gating on its existence would switch every
          consumer at once.

          NOTE: this token is scoped to `contents: read`. The default chain
          ends at secrets.GITHUB_TOKEN, which also carries `packages: read`
          for builds that install from GitHub Packages. Only opt in when the
          build needs SOURCE access; a build that needs packages must have
          that permission granted on the App first, since a token cannot
          request more than its installation holds.
        required: false
        type: boolean
        default: false
      use_buildkit_secret:
        description: 'Use BuildKit --secret for GITHUB_TOKEN instead of --build-arg (requires updated Dockerfile)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Docker Build
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      # Short-lived, installation-scoped, and not tied to anyone's account,
      # unlike the PAT fallbacks below. Opt-in only: when use-app-token is
      # false this step is skipped, its output is empty, and the chain below
      # resolves exactly as it did before this input existed.
      - name: Mint a token for private dependency access
        id: deps-token
        if: inputs.use-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Build image (legacy --build-arg)
        if: ${{ !inputs.use_buildkit_secret }}
        env:
          GITHUB_TOKEN: ${{ steps.deps-token.outputs.token || secrets.CI_TOKEN || secrets.DEPENDABOT_TOKEN || secrets.GITHUB_TOKEN }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: docker build --build-arg GITHUB_TOKEN="$GITHUB_TOKEN" -f "$DOCKERFILE" -t pr-check "$CONTEXT"

      - name: Build image (BuildKit secret)
        if: ${{ inputs.use_buildkit_secret }}
        env:
          GITHUB_TOKEN: ${{ steps.deps-token.outputs.token || secrets.CI_TOKEN || secrets.DEPENDABOT_TOKEN || secrets.GITHUB_TOKEN }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            -f "$DOCKERFILE" -t pr-check "$CONTEXT"
