name: pr-checks-actions

on:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate Actions syntax
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          wget -q https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint

      - name: Run actionlint
        run: |
          # actionlint 1.7.12 still ships the old metadata for create-github-app-token: it has client-id
          # since v2 and app-id is deprecated there, so its two complaints about them are wrong.
          # It also does not know `github.job_workflow_ref`, which GitHub defines for a job running a
          # reusable workflow — code-review.yml reads it to take its shared scripts from the same ref
          # the caller pinned the workflow to.
          ./actionlint \
            -ignore 'unknown permission scope "models"' \
            -ignore 'input "client-id" is not defined in action "actions/create-github-app-token' \
            -ignore 'missing input "app-id" which is required by action "actions/create-github-app-token' \
            -ignore 'property "job_workflow_ref" is not defined in object type'

  secret-scan:
    name: Scan for credentials
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'
