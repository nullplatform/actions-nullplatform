name: PR Checks - Go

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for go commands'
        required: false
        type: string
        default: '.'
      go-version:
        description: 'Go version (overrides go.mod if set)'
        required: false
        type: string
        default: ''
      go-private:
        description: 'GOPRIVATE glob for modules that must bypass the public proxy'
        required: false
        type: string
        default: 'github.com/nullplatform/*'

permissions:
  contents: read

jobs:
  testing:
    name: Testing
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go (with version file)
        if: inputs.go-version == ''
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Go (with explicit version)
        if: inputs.go-version != ''
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      # A workflow's GITHUB_TOKEN is scoped to its OWN repository, so `go get` of
      # a private module in the same org still 404s. Point git at a token that
      # can read it, and set GOPRIVATE so the module bypasses proxy.golang.org
      # (which cannot serve private modules) and the checksum database.
      # No-ops when no cross-repo token is configured, so public-only repos are
      # unaffected.
      - name: Configure access to private Go modules
        env:
          MODULES_TOKEN: ${{ secrets.CI_TOKEN || secrets.DEPENDABOT_TOKEN }}
          GO_PRIVATE: ${{ inputs.go-private }}
        run: |
          if [ -z "$MODULES_TOKEN" ]; then
            echo "No CI_TOKEN/DEPENDABOT_TOKEN configured; skipping private module setup."
            exit 0
          fi
          echo "GOPRIVATE=$GO_PRIVATE" >>"$GITHUB_ENV"
          git config --global \
            url."https://x-access-token:${MODULES_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: go test ./...
