name: renovate

# Biweekly bumps for the third-party binaries pinned in Dockerfiles (tofu, helm,
# kubectl, and any version written into a GitHub release URL).
#
# Dependabot cannot see these - its docker ecosystem reads FROM lines, not
# ARG + curl. Trivy detects them but cannot name the release that fixes them:
# of 54 findings against the tofu binary, 53 report the fixed version of an
# internal Go module, not of tofu. So the fix has to be a version bump in the
# Dockerfile, and Renovate is the tool that already does that reliably.
#
# The policy - which ARG maps to which upstream, how far a bump may go - lives in
# renovate-config.js. The repos it touches are the ones the Renovate App is
# installed on. Merging a PR triggers release-please, which republishes the
# image to ECR; the weekly ecr-security-scan then reports what is still open.

on:
  schedule:
    # Days 2 and 16, 09:45 ART. The base image (worker-bridge) is rebuilt on the
    # 1st and 15th; Dependabot runs daily and opens the FROM bump the same day.
    # Running the day after keeps the agreed order: base first, pinned binaries
    # second - and matches the biweekly cadence decided with security.
    - cron: '45 12 2,16 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would change without opening PRs'
        type: boolean
        default: true
      log_level:
        description: 'Renovate log level (debug shows the underlying platform errors)'
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  # The cron always opens PRs; dry-run is only for the manual dispatch.
  # Renovate runs inside a container, and renovatebot/github-action only forwards
  # env vars matching ^RENOVATE_\w+ (plus LOG_LEVEL and a few proxy vars). The
  # first dry-run was silently a real run because DRY_RUN never got in. Renovate
  # reads RENOVATE_DRY_RUN natively: "full" = log everything, change nothing.
  RENOVATE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'full' || '' }}

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Without the App there is nothing to authenticate as. Fail loudly rather
      # than run Renovate with a token that cannot write anywhere.
      - name: Is the App configured?
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_ID }}
        run: |
          if [ -z "${APP_ID}" ]; then
            echo "::error::RENOVATE_APP_ID is not configured. Renovate needs the renovate-app-nullplatform App token."
            exit 1
          fi

      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: nullplatform

      - name: Renovate
        # No renovate-version pin: the action's default decides which Renovate image runs, and
        # Dependabot keeps the action current. Pinning it here would mean the App writing this file.
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.app.outputs.token }}
          configurationFile: renovate-config.js
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DRY_RUN: ${{ env.RENOVATE_DRY_RUN }}
