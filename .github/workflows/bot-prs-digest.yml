name: bot-prs-digest

# One Slack message per cycle, on the 3rd and 17th (base image rebuilt on the 1st/15th,
# Renovate on the 2nd/16th), listing every bot PR still waiting for a merge across the org: Dependabot (base image FROM), Renovate (pinned binaries, Go,
# npm, actions) and release-please release PRs. Nobody watches 40 repos; this is the
# list the person who merges works from. Silent when there is nothing to merge.

on:
  schedule:
    - cron: '45 12 3,17 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the message and print it instead of posting it
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Only repos that publish an image. Org-wide, Dependabot alone has 150 open npm PRs in unrelated repos.
  IMAGE_REPOS: '^(services-.*|scopes(-.*)?|scope-testing|worker-bridge|k8s-tools|customers-aws-image|cli|controlplane-agent|performance-prometheus|traffic-kong-gateway-base-image|actions-nullplatform)$'

  # scopes-*/services-* repos exempt from the release-conformance check (dead since 2023).
  CONFORMANCE_IGNORE: '^(services-executor-base-image)$'

concurrency:
  group: bot-prs-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - name: Are the secrets configured?
        env:
          WEBHOOK: ${{ secrets.SLACK_SECURITY_URL }}
          APP_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          [ -n "${WEBHOOK}" ] || { echo "::error::SLACK_SECURITY_URL is not configured in this repo"; exit 1; }
          [ -n "${APP_KEY}" ] || { echo "::error::RENOVATE_APP_PRIVATE_KEY is not available: private repos would be invisible to the search"; exit 1; }

      # The Renovate App is installed on every repo with an image: its token sees the private ones too.
      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liSjqC5OQnkfqmrv
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Auto release also needs the release App to reach the repo: with the caller in place but the App
      # missing, the run starts and cannot merge. continue-on-error: a missing secret must not kill the digest.
      - name: Release App token
        id: release_app
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23lig0dHARRXDLhNxf
          private-key: ${{ secrets.APP_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Collect open bot PRs
        id: collect
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          search() { gh search prs --owner "${OWNER}" --state open --author "$1" --limit 1000 \
                       --json number,title,url,repository,createdAt --jq '.[] | . + {bot: "'"$2"'"}'; }
          {
            search app/dependabot                 Dependabot
            search app/renovate-app-nullplatform  Renovate
            search app/github-actions             release-please | jq -c 'select(.title | test("^chore(\\(.+\\))?: release"))'
          } | jq -s --arg re "${IMAGE_REPOS}" 'map(select(.repository.name | test($re))) | sort_by(.repository.name, .createdAt)' > prs.json
          echo "count=$(jq length prs.json)" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.repository.name)#\(.number) [\(.bot)] \(.title)"' prs.json

      # Core's rule: every public scopes-*/services-* repo releases through release-publish-oci and merges
      # its release PR itself. A repo listed here needs the standard set, not a hand-merged release PR.
      - name: Release conformance of scopes-*/services-*
        id: conformance
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          IGNORE: ${{ env.CONFORMANCE_IGNORE }}
          RELEASE_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail
          gh api --paginate "orgs/${OWNER}/repos?per_page=100&type=all" --jq '.[] | select(.archived == false and .visibility == "public") | .name' \
            | grep -E '^(scopes|services)-' | grep -vE "${IGNORE}" | sort > repos.txt
          # What the release App installation actually reaches. Empty file = we could not ask.
          if [ -n "${RELEASE_TOKEN}" ]; then
            GH_TOKEN="${RELEASE_TOKEN}" gh api --paginate /installation/repositories --jq '.repositories[].name' | sort > app_repos.txt
            echo "release App reaches $(wc -l < app_repos.txt | tr -d ' ') repos of the org"
          else
            : > app_repos.txt
            echo "::warning::APP_RELEASE_PRIVATE_KEY unavailable: App coverage not checked"
          fi
          : > conformance.tsv
          while read -r repo; do
            # One listing does double duty: it proves the token can read the repo, and it is the
            # file inventory. A failed call must not become a finding: a fabricated report is worse
            # than none, so the repo is skipped with a warning.
            listing=$(gh api "repos/${OWNER}/${repo}/contents/.github/workflows" 2>/dev/null || true)
            if [ -z "${listing}" ]; then
              echo "::warning::${repo}: .github/workflows not readable, skipped"
              continue
            fi
            release=''; caller=''; stray=''
            for f in $(printf '%s' "${listing}" | jq -r '.[] | select(.type == "file") | select(.name | test("\\.ya?ml$")) | .name'); do
              body=$(gh api "repos/${OWNER}/${repo}/contents/.github/workflows/${f}" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
              if [ "${f}" = "release.yml" ]; then release="${body}"; fi
              if [ "${f}" = "auto-merge-release.yml" ]; then caller="${body}"; fi
              # `|| true` on both greps: "no match" is the normal case and would abort the step
              # under `set -e -o pipefail`, which is exactly how this check shipped broken.
              hits=$(printf '%s\n' "${body}" \
                | { grep -oE 'actions-nullplatform/\.github/workflows/[A-Za-z0-9._-]+\.yml@[A-Za-z0-9._-]+' || true; } \
                | { grep -vE '@v[0-9]+$' || true; } | sed -E "s#.*/#${f}: #" | tr '\n' ' ')
              if [ -n "${hits}" ]; then stray="${stray}${hits} "; fi
            done
            problems=()
            # Both reusables count: release-publish-oci.yml (current) and release.yml (earlier services).
            grep -qE 'actions-nullplatform/.github/workflows/release(-publish-oci)?\.yml' <<< "${release}" || problems+=("no standard release.yml")
            if [ -z "${caller}" ]; then problems+=("no auto-merge caller")
            elif ! grep -q 'workflow_run' <<< "${caller}"; then problems+=("caller still on pull_request"); fi
            if [ -s app_repos.txt ] && ! grep -qx "${repo}" app_repos.txt; then problems+=("release App not installed"); fi
            # Any major tag counts, so a repo part-way through a v1 to v2 migration is not drift.
            if [ -n "${stray}" ]; then problems+=("not on a major tag: $(echo "${stray}" | tr -s ' ' | sed 's/ $//')"); fi
            [ "${#problems[@]}" -eq 0 ] || printf '%s\t%s\n' "${repo}" "$(IFS=,; echo "${problems[*]}")" >> conformance.tsv
          done < repos.txt
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {repo: .[0], problems: .[1]})' conformance.tsv > conformance.json
          echo "total=$(wc -l < repos.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length conformance.json)" >> "$GITHUB_OUTPUT"
          cat conformance.tsv

      - name: Post to Slack
        if: steps.collect.outputs.count != '0' || steps.conformance.outputs.count != '0'
        env:
          WEBHOOK: ${{ secrets.SLACK_SECURITY_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOTAL: ${{ steps.conformance.outputs.total }}
        run: |
          set -euo pipefail
          # One section per repo (Slack caps a section at 3000 chars and a message at 50 blocks).
          jq -n --arg run "$RUN_URL" --arg total "$TOTAL" --slurpfile prs prs.json --slurpfile conf conformance.json '
            ($prs[0]) as $all | ($conf[0]) as $bad
            | ($all | group_by(.repository.name) | map({type:"section", text:{type:"mrkdwn", text:
                ("*" + .[0].repository.name + "*\n" +
                 (map("• <" + .url + "|#" + (.number|tostring) + "> " + .bot + " · " + (.title|.[0:90])
                       + " · " + (((now - (.createdAt | fromdateiso8601)) / 86400 | floor | tostring) + "d"))
                  | join("\n")) | .[0:2900])}})) as $groups
            | (if ($all|length) > 0 then
                [{type:"header", text:{type:"plain_text", text:("Bot PRs waiting for merge: " + ($all|length|tostring)), emoji:true}}]
                + ($groups | .[0:42])
                + (if ($groups|length) > 42 then [{type:"section", text:{type:"mrkdwn", text:("… and " + (($groups|length) - 42 | tostring) + " more repos")}}] else [] end)
                + [{type:"context", elements:[{type:"mrkdwn", text:("Dependabot moves the base image, Renovate the pinned binaries/Go/npm, release-please cuts the release. Merge = publish. <" + $run + "|run>")}]}]
              else [] end) as $prblocks
            | (if ($bad|length) > 0 then
                [{type:"header", text:{type:"plain_text", text:("Repos without the standard auto release: " + ($bad|length|tostring) + " of " + $total), emoji:true}},
                 {type:"section", text:{type:"mrkdwn", text:(($bad | map("• *" + .repo + "*: " + .problems) | join("\n")) | .[0:2900])}},
                 {type:"context", elements:[{type:"mrkdwn", text:"Core rule: every public scopes-*/services-* repo releases with release-publish-oci and merges its release PR from workflow_run. A repo needs the standard workflows and the release App installed; without the App the caller runs and cannot merge."}]}]
              else [] end) as $confblocks
            | {blocks: ($prblocks + $confblocks)}' > slack.json
          if [ "${DRY_RUN}" = "true" ]; then echo "DRY RUN - would post:"; jq -r '.blocks[] | .text.text // .elements[0].text' slack.json; exit 0; fi
          # --fail-with-body: curl returns 0 even when Slack rejects the payload.
          curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @slack.json "${WEBHOOK}"
