name: Docker Build and Push to ECR

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the Docker image (e.g., k8s-logs-controller)'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string
      submodules:
        description: 'Check out git submodules before building (the build context includes them)'
        required: false
        type: boolean
      ref:
        description: 'Git ref to build from (branch, tag or SHA). Empty = the ref that triggered the run — pass the tag on recovery/backfill dispatches, or the image is built from the dispatched branch instead of the tagged commit'
        required: false
        type: string
        default: ''
        default: false
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Target platforms for multi-arch build'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      ecr_registry:
        description: 'ECR registry URL'
        required: false
        type: string
        default: 'public.ecr.aws/nullplatform'
      tag:
        description: 'Tag for the image'
        required: false
        type: string
        default: ''
      also_tag_latest:
        description: 'Also tag and push the image as latest'
        required: false
        type: boolean
        default: false
      aws_region:
        description: 'AWS region for ECR'
        required: false
        type: string
        default: 'us-east-1'
      build_args:
        description: 'Docker build arguments (newline-separated, e.g. "ARG1=val1\nARG2=val2")'
        required: false
        type: string
        default: ''
    outputs:
      image_digest:
        description: 'OCI image-index digest (sha256:...)'
        value: ${{ jobs.build-and-push.outputs.digest }}
      image_tag:
        description: 'Tag the image was actually pushed with (after prefix stripping)'
        value: ${{ jobs.build-and-push.outputs.version }}
    secrets:
      aws_role_arn:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      version: ${{ steps.tags.outputs.version }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
          # Empty ref = default (the triggering ref); backfills pass the tag so
          # the image content matches the tagged commit, not the dispatch branch.
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Generate image tags
        id: tags
        run: |
          REGISTRY="${{ inputs.ecr_registry }}"
          IMAGE="${{ inputs.image_name }}"
          TAG="${{ inputs.tag }}"

          if [ -z "${TAG}" ]; then
            echo "::error::Tag is required for builds"
            exit 1
          fi

          # Strip an optional monorepo prefix from the tag (logs-controller-v2.0.0
          # -> v2.0.0) while keeping the SemVer intact, prerelease and build
          # metadata included: v1.2.3-beta must NOT collapse to v1.2.3, or a
          # prerelease would squat the release tag. The match is anchored, so
          # tags that aren't semver-shaped (beta, latest) pass through untouched.
          if [[ "${TAG}" =~ ^(.*-)?(v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
          else
            VERSION="${TAG}"
          fi
          TAGS="${REGISTRY}/${IMAGE}:${VERSION}"

          if [ "${{ inputs.also_tag_latest }}" = "true" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract image digest
        id: digest
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          if [[ -z "$DIGEST" ]]; then
            echo "::error::digest missing from build output"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
