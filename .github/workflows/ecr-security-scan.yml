name: ECR Security Scan

on:
  workflow_call:
    inputs:
      image_names:
        description: 'JSON array of image names to scan (e.g., ["k8s-logs-controller", "k8s-traffic-manager"])'
        required: true
        type: string
      ecr_registry:
        description: 'ECR registry URL'
        required: false
        type: string
        default: 'public.ecr.aws/nullplatform'
      severity:
        description: 'Minimum severity to report (CRITICAL,HIGH,MEDIUM,LOW)'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      upload_sarif:
        description: >-
          Upload SARIF results to the GitHub Security tab. Defaults to false:
          this workflow writes one SARIF per image and uploads them under a
          single category, which CodeQL rejects when more than one image is
          scanned ("does not support uploading multiple SARIF runs with the
          same category"). Only enable it for a single-image caller. Multi-image
          upload needs one category per image, which requires running the scan
          as a matrix - tracked for the centralized scanner.
        required: false
        type: boolean
        default: false
      fix_pr_author:
        description: Author whose open PRs count as "fix waiting for merge". Dependabot and humans also use the dependencies label.
        required: false
        type: string
        default: app/renovate-app-nullplatform
      always_notify:
        description: >-
          Post to Slack even when nothing was found. A report that only speaks
          when it has findings is indistinguishable from a dead one - that is how
          this scan sat broken for four months. The centralized caller sets this.
        required: false
        type: boolean
        default: false
    secrets:
      aws_role_arn:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true
      slack_webhook_url:
        description: 'Slack webhook URL for vulnerability alerts'
        required: true
      app_id:
        description: GitHub App used only to list open fix PRs in private image repos. Optional; public repos work with the default token.
        required: false
      app_private_key:
        required: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: Scan ECR Images
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APP_ID: ${{ secrets.app_id }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Install Trivy (pinned + checksum verified)
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.74.0"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLo trivy_checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: App token for PR lookup
        id: pr_token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Image to source-repo map
        id: repo_map
        run: |
          # Label org.opencontainers.image.source wins; this map covers images that do not carry it.
          MAP=$(curl -fsSL https://raw.githubusercontent.com/nullplatform/actions-nullplatform/main/.github/ecr-image-repos.json 2>/dev/null || echo '{}')
          echo "$MAP" | jq -e . >/dev/null 2>&1 || MAP='{}'
          echo "map=$(echo "$MAP" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Get latest tags and scan images
        id: scan
        env:
          IMAGE_NAMES: ${{ inputs.image_names }}
          REGISTRY: ${{ inputs.ecr_registry }}
          SEVERITY: ${{ inputs.severity }}
          UPLOAD_SARIF: ${{ inputs.upload_sarif }}
          GH_TOKEN: ${{ steps.pr_token.outputs.token || github.token }}
          REPO_MAP: ${{ steps.repo_map.outputs.map }}
          FIX_PR_AUTHOR: ${{ inputs.fix_pr_author }}
        run: |
          VULNERABILITIES_FOUND=false
          REPORT=""
          UNSCANNED=""
          STALE=""
          SCANNED=0

          for IMAGE_NAME in $(echo "$IMAGE_NAMES" | jq -r '.[]'); do
            echo "Finding latest tag for ${IMAGE_NAME}..."

            # One describe-images per image; a missing repository is reported as such, not as "no tag".
            if ! DESC=$(aws ecr-public describe-images --repository-name "${IMAGE_NAME}" --region us-east-1 --output json 2>&1); then
              echo "::warning::${IMAGE_NAME}: $(echo "${DESC}" | tr -d '\n' | cut -c1-200)"
              UNSCANNED="${UNSCANNED}\n*${IMAGE_NAME}*: repository not found or not readable"
              continue
            fi
            # Newest push among version-shaped tags: highest semver alone picks abandoned lines, newest push alone picks experimental tags.
            LATEST_TAG=$(echo "${DESC}" | jq -r '.imageDetails[] | select(.imageTags != null) | .imagePushedAt as $d | .imageTags[]
                       | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")) | "\($d)\t\(.)"' | sort | tail -1 | cut -f2)

            if [ -z "${LATEST_TAG}" ]; then
              # A silent skip is what hid scopes/* and services/* for months; report it instead.
              echo "::warning::${IMAGE_NAME}: no version-shaped tag, cannot scan"
              UNSCANNED="${UNSCANNED}\n*${IMAGE_NAME}*: no version-shaped tag"
              continue
            fi

            # A version tag far behind the newest push means the repo stopped versioning and this would scan a dead image.
            TAG_DATE=$(echo "${DESC}" | jq -r --arg t "${LATEST_TAG}" '.imageDetails[] | select(.imageTags // [] | index($t)) | .imagePushedAt' | head -1)
            LAST_PUSH=$(echo "${DESC}" | jq -r '[.imageDetails[].imagePushedAt] | max')
            if [ -n "${TAG_DATE}" ] && [ -n "${LAST_PUSH}" ]; then
              GAP=$(( ( $(date -u -d "${LAST_PUSH}" +%s) - $(date -u -d "${TAG_DATE}" +%s) ) / 86400 ))
              if [ "${GAP}" -gt 120 ]; then
                echo "::warning::${IMAGE_NAME}: el tag ${LATEST_TAG} esta ${GAP} dias detras del ultimo push"
                STALE="${STALE}\n*${IMAGE_NAME}*: ultima version ${LATEST_TAG}, ${GAP} dias sin versionar"
              fi
            fi

            FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${LATEST_TAG}"
            echo "Scanning ${FULL_IMAGE}..."

            # Pull the image
            docker pull "${FULL_IMAGE}" || continue

            # Run Trivy and capture output
            RESULT=$(trivy image --severity "${SEVERITY}" --ignore-unfixed --format json "${FULL_IMAGE}" 2>/dev/null || echo "{}")

            if [ "${UPLOAD_SARIF}" == "true" ]; then
              mkdir -p sarif-results
              trivy image --severity "${SEVERITY}" --ignore-unfixed --format sarif --output "sarif-results/${IMAGE_NAME}.sarif" "${FULL_IMAGE}" 2>/dev/null || true
            fi

            # Count vulnerabilities
            CRITICAL=$(echo "$RESULT" | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' 2>/dev/null || echo "0")
            HIGH=$(echo "$RESULT" | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' 2>/dev/null || echo "0")

            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              VULNERABILITIES_FOUND=true
              # The line is an action, not a CVE list: a fixable finding still published after Renovate ran means a PR to merge, a rebuild, or a decision.
              SRC=$(echo "$RESULT" | jq -r '.Metadata.ImageConfig.config.Labels["org.opencontainers.image.source"] // empty' | sed -E 's#^https://github\.com/[^/]+/([^/]+).*$#\1#')
              [ -z "${SRC}" ] && SRC=$(echo "${REPO_MAP}" | jq -r --arg i "${IMAGE_NAME}" '.[$i] // empty')
              if [ -z "${SRC}" ]; then
                ACTION="source repo unknown, add it to ecr-image-repos.json"
              elif PRS=$(gh pr list -R "${GITHUB_REPOSITORY_OWNER}/${SRC}" --state open --author "${FIX_PR_AUTHOR}" --label dependencies --json number,url --jq '[.[] | "<\(.url)|#\(.number)>"] | join(" ")' 2>/dev/null); then
                if [ -n "${PRS}" ]; then ACTION="${SRC}: merge ${PRS}"; else ACTION="${SRC}: no open fix PR, rebuild on the current base or decide"; fi
              else
                ACTION="${SRC}: could not list PRs (private repo, pass app_id/app_private_key)"
              fi
              REPORT="${REPORT}\n*${IMAGE_NAME}:${LATEST_TAG}*: ${CRITICAL} critical, ${HIGH} high -> ${ACTION}"
            fi

            echo "  Critical: ${CRITICAL}, High: ${HIGH}"
            SCANNED=$((SCANNED+1))
          done

          {
            echo "vulnerabilities_found=${VULNERABILITIES_FOUND}"
            echo "scanned=${SCANNED}"
            echo "total=$(echo "$IMAGE_NAMES" | jq length)"
          } >> "$GITHUB_OUTPUT"
          if [ -n "${UNSCANNED}" ]; then VULNERABILITIES_FOUND=true; fi
          REPORT="${REPORT}${UNSCANNED}${STALE}"
          if [ -n "${STALE}" ]; then VULNERABILITIES_FOUND=true; fi

          # Save report for Slack (escape newlines for JSON)
          REPORT_ESCAPED=$(echo -e "$REPORT" | sed 's/"/\\"/g' | tr '\n' '\001' | sed 's/\x01/\\n/g')
          echo "report=${REPORT_ESCAPED}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub Security tab
        if: inputs.upload_sarif && hashFiles('sarif-results/') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/
          category: trivy-ecr
        continue-on-error: true

      - name: Send Slack alert
        if: steps.scan.outputs.vulnerabilities_found == 'true' || inputs.always_notify
        env:
          FOUND: ${{ steps.scan.outputs.vulnerabilities_found }}
          REPORT: ${{ steps.scan.outputs.report }}
          SCANNED: ${{ steps.scan.outputs.scanned }}
          TOTAL: ${{ steps.scan.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.slack_webhook_url }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::slack_webhook_url is empty: skipping the Slack alert"
            exit 0
          fi
          # The scan step pre-escapes REPORT for hand-built JSON (backslash-n, backslash-quote).
          # Undo that and let jq do the escaping: hand-escaping is how a report ends up unsent.
          REPORT_TXT=$(printf '%b' "${REPORT}" | sed 's/\\"/"/g')
          if [ "${FOUND}" = "true" ]; then
            HEADLINE="Image scan: actions pending"
            BODY="Scanned ${SCANNED}/${TOTAL} images. Still published with a fixable CRITICAL/HIGH after Renovate and the base rebuild, or out of the automation's reach:${REPORT_TXT}"
          else
            HEADLINE="Image scan: ${SCANNED}/${TOTAL} images clean"
            BODY="No fixable CRITICAL or HIGH findings. This message is the heartbeat: if it stops arriving, the scan is broken."
          fi
          jq -n --arg h "$HEADLINE" --arg b "$BODY" --arg run "$RUN_URL" '{blocks:[
            {type:"header",text:{type:"plain_text",text:$h,emoji:true}},
            {type:"section",text:{type:"mrkdwn",text:$b}},
            {type:"context",elements:[{type:"mrkdwn",text:("<"+$run+"|View full scan results>")}]}]}' > slack.json
          # --fail-with-body: curl returns 0 even when Slack rejects the payload.
          curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @slack.json "${WEBHOOK}"

      - name: Summary
        run: |
          if [ "${{ steps.scan.outputs.vulnerabilities_found }}" == "true" ]; then
            echo "::warning::Vulnerabilities found in one or more images"
          else
            echo "No critical or high vulnerabilities found"
          fi
