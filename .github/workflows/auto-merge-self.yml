name: auto-merge-release-pr

# Merges the release PR this repository leaves open for itself, once its own release workflow
# finishes. on: workflow_run and not pull_request: since GitHub's 2026-06-11 change, pull_request
# runs of PRs opened by github-actions[bot] are held for manual approval.
on:
  workflow_run:
    workflows: ["Release Self"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: ./.github/workflows/auto-merge-release.yml
    secrets:
      app-id: ${{ secrets.APP_RELEASE_ID }}
      app-private-key: ${{ secrets.APP_RELEASE_PRIVATE_KEY }}
