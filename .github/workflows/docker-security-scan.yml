name: Docker Security Scan

on:
  workflow_call:
    inputs:
      context:
        description: 'Build context directory'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        required: false
        type: string
        default: 'Dockerfile'
      image_name:
        description: 'Name for the scanned image (used for reporting)'
        required: true
        type: string
      severity:
        description: 'Minimum severity to report (CRITICAL,HIGH,MEDIUM,LOW)'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      build_args:
        description: 'Docker build arguments (multiline, one per line: KEY=VALUE)'
        required: false
        type: string
        default: ''
      exit_code:
        description: 'Exit code when vulnerabilities are found (0 to not fail)'
        required: false
        type: number
        default: 1
      upload_sarif:
        description: 'Upload SARIF results to GitHub Security tab'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A run step does not see the cache service variables that type=gha needs;
      # build-push-action exposed them itself.
      - name: Expose GitHub runtime for the build cache
        uses: crazy-max/ghaction-github-runtime@v4

      # Base images on ECR Public are pulled anonymously, and ECR Public throttles
      # per IP with a 429 that GitHub runners, sharing their IPs, hit often. Logging
      # in would not cover Dependabot pull requests (no secrets), so a throttled
      # build is retried with backoff; any other failure fails at once.
      - name: Build image for scanning
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.context }}/${{ inputs.dockerfile }}
          IMAGE: ${{ inputs.image_name }}:scan
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"
          for attempt in 1 2 3 4; do
            if docker buildx build --platform linux/amd64 --load -t "$IMAGE" -f "$DOCKERFILE" \
                --cache-from type=gha --cache-to type=gha,mode=max \
                ${args[@]+"${args[@]}"} "$CONTEXT" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              exit 0
            fi
            if ! grep -qE '429 Too Many Requests|TOOMANYREQUESTS' "$RUNNER_TEMP/build.log"; then
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::ECR Public throttled the base pull (attempt $attempt); retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::ECR Public kept throttling the base pull"
          exit 1

      - name: Run Trivy vulnerability scanner
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: '${{ inputs.image_name }}:scan'
          format: 'table'
          exit-code: '${{ inputs.exit_code }}'
          severity: '${{ inputs.severity }}'
          ignore-unfixed: true
        continue-on-error: true

      - name: Generate SARIF report
        if: inputs.upload_sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: '${{ inputs.image_name }}:scan'
          format: 'sarif'
          output: 'results.sarif'
          severity: '${{ inputs.severity }}'
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        if: inputs.upload_sarif && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: trivy-docker-${{ inputs.image_name }}
        continue-on-error: true

      - name: Fail if vulnerabilities found
        if: steps.scan.outcome == 'failure'
        run: exit 1
