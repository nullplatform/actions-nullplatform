name: shellcheck

on:
  workflow_call:
    inputs:
      script_dirs:
        description: 'Space-separated dirs/files to scan. When empty, auto-discovers *.sh files and extensionless files with a shell shebang.'
        required: false
        type: string
        default: ''
      severity:
        description: 'Minimum severity (error, warning, info, style)'
        required: false
        type: string
        default: 'error'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        env:
          SCRIPT_DIRS: ${{ inputs.script_dirs }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          if [ -n "$SCRIPT_DIRS" ]; then
            # Explicit dirs/files (space-separated): scan every file under them.
            # shellcheck disable=SC2086 # intentional word-splitting for multiple paths
            find $SCRIPT_DIRS -type f -print0 | xargs -0 -r shellcheck --severity="$SEVERITY"
          else
            # Auto-discover: *.sh files plus extensionless files with a shell shebang.
            # Many repos ship executable scripts without a .sh extension (e.g. an
            # entrypoint or providers/*/setup), which `find -name '*.sh'` misses.
            {
              find . -type f -name '*.sh' \
                -not -path './.git/*' -not -path '*/.terraform/*' -not -path '*/node_modules/*' -print0
              find . -type f ! -name '*.*' \
                -not -path './.git/*' -not -path '*/.terraform/*' -not -path '*/node_modules/*' -print0 \
                | { xargs -0 -r grep -lZE '^#!.*sh' || true; }
            } | sort -zu | xargs -0 -r shellcheck --severity="$SEVERITY"
          fi
