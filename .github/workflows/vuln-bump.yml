name: vuln-bump

# Propone bumps de los binarios de terceros pineados en los Dockerfiles de los
# repos que publican imagenes, y abre el PR que los aplica.
#
# Por que existe: esos binarios (tofu, helm, kubectl) no los ve Dependabot — no
# estan en ningun go.mod ni package.json, se bajan con curl dentro del Dockerfile.
# Trivy si los ve, porque lee la metadata del binario Go compilado. En septiembre
# de 2026 acumulaban 462 hallazgos CRITICAL/HIGH por estar simplemente atrasados.
#
# El disparador es la vulnerabilidad, no la version nueva. Resuelve la version
# MINIMA que deja de estarlo, respetando el techo de pins.yml. Un bumper por
# version habria llevado helm a 4.x (breaking) y kubectl a 1.37 (rompe el skew
# contra clusters de clientes); este propone helm 3.22.0, que alcanza, y para
# kubectl reporta que no hay salida segura en vez de inventar una.
#
# El PR queda para que una persona lo apruebe. Al mergear, release-please corta la
# version y la cadena republica la imagen a ECR — eso ya funciona.

on:
  schedule:
    - cron: '45 12 * * 1'      # lunes 09:45 ART
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo calcular y reportar, sin abrir PRs'
        type: boolean
        default: true

permissions:
  contents: read

# Un dispatch manual durante el cron abriria PRs duplicados en la ventana entre
# el chequeo de idempotencia y la creacion. Una corrida a la vez.
concurrency:
  group: vuln-bump
  cancel-in-progress: false

env:
  # En el cron siempre abre PRs; el dry-run es solo para la corrida manual.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  bump:
    name: Resolver y proponer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Trivy (pinned + checksum verified)
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.74.0"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          # --retry: la CDN de releases devuelve 504 de a ratos, y sin esto el run
          # entero se cae por un hipo de red (paso dos veces seguidas el 2026-09-14).
          curl -fsSLO --retry 3 --retry-all-errors --retry-delay 5 "${base}/${tarball}"
          curl -fsSLo trivy_checksums.txt --retry 3 --retry-all-errors "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" trivy && sudo mv trivy /usr/local/bin/trivy

      # Escanear <tool>@<version> da siempre lo mismo: el binario es inmutable.
      # Solo se mueve la base de Trivy, y por eso la clave lleva el numero de run.
      - name: Cache de escaneos y de la DB de Trivy
        uses: actions/cache@v4
        with:
          path: |
            /tmp/vuln-bump-cache
            ~/.cache/trivy
          key: vuln-bump-${{ hashFiles('.github/vuln-bump/pins.yml') }}-${{ github.run_id }}
          restore-keys: vuln-bump-

      - run: pip install --quiet pyyaml

      - name: Resolver bumps minimos seguros
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_DIR: /tmp/vuln-bump-cache
        run: node .github/vuln-bump/plan.js .github/vuln-bump/pins.yml | tee plan.txt

      # La App np-vuln-bump: contents:write + pull_requests:write, acotada a los
      # repos de pins.yml. Si no esta configurada, el workflow reporta igual en vez
      # de fallar — el reporte del lunes es la senal de vida y no debe depender de
      # que la parte de escritura este lista.
      - name: La App esta configurada?
        id: appcheck
        env:
          APP_ID: ${{ secrets.VULN_BUMP_APP_ID }}
        run: |
          if [ -n "${APP_ID}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"
               echo "::warning::VULN_BUMP_APP_ID no esta configurado: no se abriran PRs"
          fi

      - name: Token de la App
        id: apptoken
        if: env.DRY_RUN != 'true' && steps.appcheck.outputs.ok == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VULN_BUMP_APP_ID }}
          private-key: ${{ secrets.VULN_BUMP_PRIVATE_KEY }}
          owner: nullplatform

      - name: Abrir PRs
        if: env.DRY_RUN != 'true' && steps.appcheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: node .github/vuln-bump/open-pr.js plan.json

      - name: Armar el reporte
        run: node .github/vuln-bump/report.js plan.json prs.json | tee report.txt

      - name: Enviar a Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL no esta configurado: el reporte queda solo en el summary"
            exit 0
          fi
          # --fail-with-body: curl devuelve 0 aunque Slack rechace el payload, y sin
          # esto un mensaje mal formado pasaria por enviado.
          curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
            --data @slack.json "${WEBHOOK}"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Plan'
            echo '```'; cat plan.txt 2>/dev/null || echo '(sin plan)'; echo '```'
            echo '## Reporte'
            echo '```'; cat report.txt 2>/dev/null || echo '(sin reporte)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vuln-bump-${{ github.run_id }}
          path: |
            plan.txt
            plan.json
            report.txt
            prs.json
