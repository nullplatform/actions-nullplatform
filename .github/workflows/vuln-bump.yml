name: vuln-bump

# Proposes bumps for the third-party binaries pinned in the Dockerfiles of the
# repos that publish images, and opens the PR that applies them.
#
# Why it exists: Dependabot cannot see those binaries (tofu, helm, kubectl) - they
# are in no go.mod or package.json, they are curl'd inside the Dockerfile. Trivy
# can, because it reads the metadata of the compiled Go binary. In September 2026
# they had accumulated 462 fixable CRITICAL/HIGH findings purely from being behind.
#
# The trigger is the vulnerability, not a new version. It resolves the LOWEST
# version that is no longer vulnerable, within the ceiling from pins.yml. A
# version-driven bumper would have taken helm to 4.x (breaking) and kubectl to
# 1.37 (breaks the skew against customer clusters); this one proposes helm 3.22.0,
# which suffices, and for kubectl reports that no safe version exists rather than
# inventing one.
#
# The PR is left for a person to approve. On merge, release-please cuts the
# version and the chain republishes the image to ECR - that part already works.

on:
  schedule:
    - cron: '45 12 * * 1'      # lunes 09:45 ART
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only compute and report, do not open PRs'
        type: boolean
        default: true

permissions:
  contents: read

# A manual dispatch during the cron would open duplicate PRs in the window between
# the idempotency check and creation. One run at a time.
concurrency:
  group: vuln-bump
  cancel-in-progress: false

env:
  # The cron always opens PRs; dry-run is only for the manual dispatch.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  bump:
    name: Resolve and propose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Trivy (pinned + checksum verified)
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.74.0"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          # --retry: the releases CDN returns 504 now and then, and without this the
          # whole run dies on a network hiccup (happened twice in a row 2026-09-14).
          curl -fsSLO --retry 3 --retry-all-errors --retry-delay 5 "${base}/${tarball}"
          curl -fsSLo trivy_checksums.txt --retry 3 --retry-all-errors "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" trivy && sudo mv trivy /usr/local/bin/trivy

      # Scanning <tool>@<version> always yields the same result: the binary is
      # immutable. Only Trivy's DB moves, which is why the key carries the run id.
      - name: Cache scans and the Trivy DB
        uses: actions/cache@v4
        with:
          path: |
            /tmp/vuln-bump-cache
            ~/.cache/trivy
          key: vuln-bump-${{ hashFiles('.github/vuln-bump/pins.yml') }}-${{ github.run_id }}
          restore-keys: vuln-bump-

      - run: pip install --quiet pyyaml

      # Discover the pins instead of declaring them. The hand-written inventory
      # was stale within a day: it listed 12 while the org had 20, and three of
      # the eight it missed were still on the vulnerable tofu 1.10.10.
      - name: Discover pins across the org
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/vuln-bump/discover.js .github/vuln-bump/pins.yml

      - name: Resolve minimum safe bumps
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_DIR: /tmp/vuln-bump-cache
        run: node .github/vuln-bump/plan.js .github/vuln-bump/pins.yml discovered.json | tee plan.txt

      # The np-vuln-bump App: contents:write + pull_requests:write, scoped to the
      # repos in pins.yml. If it is not configured the workflow still reports
      # instead of failing - Monday's report is the sign of life and must not
      # depend on the write side being ready.
      - name: Is the App configured?
        id: appcheck
        env:
          APP_ID: ${{ secrets.VULN_BUMP_APP_ID }}
        run: |
          if [ -n "${APP_ID}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"
               echo "::warning::VULN_BUMP_APP_ID is not configured: no PRs will be opened"
          fi

      - name: App token
        id: apptoken
        if: env.DRY_RUN != 'true' && steps.appcheck.outputs.ok == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VULN_BUMP_APP_ID }}
          private-key: ${{ secrets.VULN_BUMP_PRIVATE_KEY }}
          owner: nullplatform

      - name: Open PRs
        if: env.DRY_RUN != 'true' && steps.appcheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: node .github/vuln-bump/open-pr.js plan.json

      - name: Build the report
        run: node .github/vuln-bump/report.js plan.json prs.json | tee report.txt

      - name: Send to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured: the report stays in the summary only"
            exit 0
          fi
          # --fail-with-body: curl returns 0 even when Slack rejects the payload, and
          # without this a malformed message would pass as delivered.
          curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
            --data @slack.json "${WEBHOOK}"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Plan'
            echo '```'; cat plan.txt 2>/dev/null || echo '(no plan)'; echo '```'
            echo '## Report'
            echo '```'; cat report.txt 2>/dev/null || echo '(no report)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vuln-bump-${{ github.run_id }}
          path: |
            discovered.json
            plan.txt
            plan.json
            report.txt
            prs.json
