name: PR Checks - Node (pnpm)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for pnpm commands'
        required: false
        type: string
        default: '.'
      node-version:
        description: 'Node.js version (overrides .node-version file if set)'
        required: false
        type: string
        default: ''
      # The three inputs below are opt-in. Left at their defaults, the job runs exactly
      # as before: shallow checkout, lint, `pnpm test`.
      changed-since:
        description: >-
          Git ref (usually `github.event.pull_request.base.sha`). When set, the checkout
          fetches full history and tests run as `pnpm test --changed <ref>`, so only
          the test files related to the diff execute (vitest). Empty = run the whole suite.
        required: false
        type: string
        default: ''
      shard:
        description: >-
          Vitest shard to run, as `<index>/<count>` (e.g. `2/4`). Call this workflow from a
          matrix job to spread the suite across runners. Empty = no sharding.
        required: false
        type: string
        default: ''
      lint:
        description: 'Run the lint step. Set to false on all but one shard so lint runs once.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  testing:
    name: Testing
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.CI_TOKEN || secrets.DEPENDABOT_TOKEN || secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # `--changed <ref>` diffs `<ref>...HEAD`, so the ref has to be in the local history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.changed-since != '' && '0' || '1' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (with version file)
        if: inputs.node-version == ''
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Setup Node.js (with explicit version)
        if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install

      - name: Lint
        if: inputs.lint
        uses: nullplatform/actions-nullplatform/.github/actions/run-first@main
        with:
          candidates: 'test:static lint'
          package-manager: pnpm
          working-directory: ${{ inputs.working-directory }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        env:
          CHANGED_SINCE: ${{ inputs.changed-since }}
          SHARD: ${{ inputs.shard }}
        run: |
          ARGS=()
          if [ -n "$CHANGED_SINCE" ]; then ARGS+=(--changed "$CHANGED_SINCE"); fi
          # A shard can end up with no test files once `--changed` has filtered the suite.
          if [ -n "$SHARD" ]; then ARGS+=(--shard "$SHARD" --passWithNoTests); fi
          # No `--` separator: pnpm forwards it verbatim and vitest then reads everything
          # after it as positional filters, so the flags would be ignored.
          pnpm test "${ARGS[@]}"
