# Historically "tofu-release"; renamed when service repos (via
# release-publish-oci) started consuming it too. Only the display name
# changed — inputs, jobs, and defaults are untouched.
name: release

on:
  workflow_call:
    inputs:
      release-type:
        description: 'Release Please release type (e.g. terraform-module, simple, node)'
        required: false
        type: string
        default: terraform-module
      update_readme_versions:
        description: 'Update version references in README files after release'
        required: false
        type: boolean
        default: true
    # Exposed so callers can chain publish/register jobs in the SAME workflow
    # run. Chaining here is the standard: release-please creates tags with
    # GITHUB_TOKEN, and GitHub never triggers workflows from bot-token events,
    # so a separate `on: push: tags` publish workflow silently does not fire.
    outputs:
      release_created:
        description: 'true when release-please cut a release on this run'
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: 'Tag of the created release (e.g. v1.2.3)'
        value: ${{ jobs.release.outputs.tag_name }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: ${{ inputs.release-type }}

  update-readme-versions:
    name: Update README Versions
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' && inputs.update_readme_versions }}
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update this repository's README versions
        env:
          NEW_VERSION: ${{ needs.release.outputs.tag_name }}
        run: |
          # Only references to THIS repository move to the new tag. A README
          # may also pin other repositories (a service README showing the
          # tofu-modules module that installs it, for example): those refs
          # belong to other release lines and stay as their author wrote them.
          # Matched form, with or without the git:: prefix:
          #   github.com/<owner>/<repo>[.git][//<path>]?ref=vX.Y.Z
          REPOSITORY_PATTERN=$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[.]/\\./g')
          SOURCE_PATTERN="github\.com/${REPOSITORY_PATTERN}(\.git)?(//[^?[:space:]]*)?\?ref="
          echo "Updating github.com/$GITHUB_REPOSITORY refs in READMEs to $NEW_VERSION"

          find . -name "README.md" -not -path "*/.terraform/*" -type f | while read -r README; do
            if grep -Eq "${SOURCE_PATTERN}v[0-9]" "$README"; then
              echo "Updating $README"
              sed -i -E "s#(${SOURCE_PATTERN})v[0-9]+\.[0-9]+\.[0-9]+#\1${NEW_VERSION}#g" "$README"
            fi
          done

      - name: Commit and push
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A '*.md' || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update all module READMEs to $VERSION [skip ci]"
            git push
          fi
        env:
          HUSKY: 0
